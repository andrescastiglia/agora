services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://agora:agora@postgres:5432/agora
      CHAT_PROVIDER: ${CHAT_PROVIDER:-telegram}
      KNOWLEDGE_SPACE_ID: ${KNOWLEDGE_SPACE_ID:-agora}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-change-me}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-change-me}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:--1000000000000}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-1}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-agora_telegram_bot}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-change-me}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-change-me}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      WHATSAPP_ALLOWED_USER_IDS: ${WHATSAPP_ALLOWED_USER_IDS:-}
      RUST_LOG: ${RUST_LOG:-agora=debug,tower_http=info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
