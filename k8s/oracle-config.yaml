# /etc/rancher/k3s/config.yaml; root-only installation configuration, not an API manifest.
node-name: oracle
node-ip: 10.0.0.113
advertise-address: 10.0.0.113
bind-address: 10.0.0.113
tls-san: [oracle]
write-kubeconfig-mode: "0600"
cluster-init: true
secrets-encryption: true
cluster-cidr: 10.42.0.0/16
service-cidr: 10.43.0.0/16
flannel-iface: enp0s6
disable: [traefik, servicelb]
kube-proxy-arg:
  - nodeport-addresses=127.0.0.0/8
  - proxy-mode=iptables
  - iptables-localhost-nodeports=true
kubelet-arg:
  - fail-swap-on=false
# memorySwap.swapBehavior=NoSwap is the verified default for the pinned version.
