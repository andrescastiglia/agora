apiVersion: v1
kind: ServiceAccount
metadata:
  name: agora
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agora
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agora
  template:
    metadata:
      labels:
        app: agora
    spec:
      serviceAccountName: agora
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agora
          image: ghcr.io/andrescastiglia/agora
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agora-config
            - secretRef:
                name: agora-runtime
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8080
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
